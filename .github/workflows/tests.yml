# Tests d'intégration de l'API à chaque envoi sur GitHub (base MySQL 8.4 fournie par GitHub Actions).
# PayTech et WhatsApp sont remplacés par un serveur local dans les tests : aucun appel réel.
name: Tests API

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: westaf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Connexion à la base de test
        run: echo '{"port":3306,"user":"root","dbName":"westaf_test"}' > test/.db.json
      - run: npm test
